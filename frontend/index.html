<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fullstack Scaffold - Vue 3 + Vite + TypeScript" />
    <title>%VITE_APP_TITLE%</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        font-family:
          'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .scaffold-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        height: 100%;
        background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
        color: #e5e7eb;
      }
      .scaffold-loading__spinner {
        width: 56px;
        height: 56px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: scaffold-spin 1s linear infinite;
      }
      .scaffold-loading__text {
        margin-top: 18px;
        font-size: 14px;
        letter-spacing: 0.05em;
      }
      @keyframes scaffold-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="scaffold-loading">
        <div class="scaffold-loading__spinner"></div>
        <div class="scaffold-loading__text">Loading scaffold…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
