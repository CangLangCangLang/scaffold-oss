# 项目相关配置
scaffold:
  # 名称
  name: ${APP_NAME:Scaffold}
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/scaffold/uploadPath，Linux配置 /home/scaffold/uploadPath）
  # 缺省走相对路径，避免本机没 D 盘 / Linux 路径不存在导致 file 模块上传 500
  profile: ${APP_UPLOAD_PATH:./uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为9080
  port: ${SERVER_PORT:9080}
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.scaffold: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:druid}
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:/db/changelog/db.changelog-master.yml
    # 启动后立即对 changelog 进行 validate（CI / 灰度环境强烈建议打开）
    validate-on-startup: ${LIQUIBASE_VALIDATE_ON_STARTUP:false}
    halt-on-validation-failure: ${LIQUIBASE_HALT_ON_VALIDATION_FAILURE:true}
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: ${REDIS_HOST:localhost}
      # 端口，默认为6379
      port: ${REDIS_PORT:6379}
      # 数据库索引
      database: ${REDIS_DATABASE:3}
      # 密码
      password: ${REDIS_PASSWORD:123456}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${JWT_SECRET:abcdefghijklmnopqrstuvwxyz}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.scaffold.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Actuator 监控端点
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,prometheus,metrics,env,loggers,scaffold-modules}
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${APP_NAME:scaffold}
  prometheus:
    metrics:
      export:
        enabled: true

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.scaffold.web.controller.tool
    - group: 'cms'
      display-name: 'CMS 内容管理（M-3）'
      paths-to-match: '/cms/**'
      packages-to-scan: com.scaffold.module.cms.controller
    - group: 'inbox'
      display-name: 'Inbox 收件箱'
      paths-to-match: '/system/inbox/**'
      packages-to-scan: com.scaffold.module.inbox.controller
    - group: 'form'
      display-name: '通用表单引擎（M-10）'
      paths-to-match: '/form/**,/system/upload/**'
      packages-to-scan: com.scaffold.module.form.controller,com.scaffold.web.controller.system

# CORS 跨域配置（生产建议显式配置 allowed-origins，不要使用通配）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allowed-methods: ${CORS_ALLOWED_METHODS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max-age: ${CORS_MAX_AGE:1800}

# 文件存储配置：type=local 走本地磁盘；type=s3 走 S3 / MinIO / OSS 兼容存储
file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    local-root: ${FILE_STORAGE_LOCAL_ROOT:}
    url-prefix: ${FILE_STORAGE_URL_PREFIX:/profile}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      bucket: ${S3_BUCKET:}
      path-style: ${S3_PATH_STYLE:true}
      public-url: ${S3_PUBLIC_URL:}

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# WebSocket 推送总线
websocket:
  # 握手 Origin 白名单（多个用逗号分隔），生产环境建议显式收敛
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:*}
  bus:
    # 多实例 fan-out 使用的 Redis Pub/Sub 频道
    channel: ${WEBSOCKET_BUS_CHANNEL:scaffold:ws:bus}

# 离线消息盒
inbox:
  # 默认保留时长（秒），到期由 Quartz 任务清理
  default-ttl-seconds: ${INBOX_DEFAULT_TTL:604800}
  # 业务调用 MessagePublisher 时是否落库（关闭则退化为纯瞬时推送）
  persist: ${INBOX_PERSIST:true}

# 工作流模块（Flowable 8）：仅在 scaffold-module-workflow 引入时生效
flowable:
  # 启动时自动建表（首次运行 / 升级时使用）；生产稳定后可改 false 让运维主动 DDL
  database-schema-update: ${FLOWABLE_SCHEMA_UPDATE:true}
  # 关闭 Flowable classpath 自动部署，避免默认关的 *-workflow 桥 jar 中 processes/*.bpmn20.xml 被无条件部署；
  # 各桥模块启用后由自己的 ProcessDeployer 按 @ConditionalOnProperty 显式部署。
  check-process-definitions: ${FLOWABLE_CHECK_PROCESS_DEFINITIONS:false}
  # 异步执行器（处理定时器、异步任务）。MVP 不强需，可改 true 解锁全部 BPMN 能力
  async-executor-activate: ${FLOWABLE_ASYNC_ENABLED:false}
  # 历史归档级别：full=保留所有变量与表单 / audit（默认）/ activity / none
  history-level: ${FLOWABLE_HISTORY_LEVEL:audit}
  # Flowable 8 默认 Jackson 3；为兼容脚手架 Jackson 2，回退到 jackson2
  variable-json-mapper: jackson2

# 可插拔模块开关
# ─────────────────────────────────────────────────────────────────────────
# 主模块、桥模块通过 @ConditionalOnProperty 决定加载。
# 「默认开」= matchIfMissing=true，可省略此处；「默认关」= 必须显式 =true 才装载。
# 删除 admin/pom.xml 依赖 = 彻底下线，jar 不在 classpath。
#
# ┌──────────────────────────────────────┬────────┬───────────────────────────────┐
# │ 模块                                 │ 默认值 │ 关停 / 开启方式               │
# ├──────────────────────────────────────┼────────┼───────────────────────────────┤
# │ scaffold-module-inbox                │ 开     │ APP_MODULE_INBOX=false        │
# │ scaffold-module-workflow             │ 开     │ APP_MODULE_WORKFLOW=false     │
# │ scaffold-module-cms                  │ 开     │ app.module.cms.enabled=false  │
# │ scaffold-module-form                 │ 开     │ app.module.form.enabled=false │
# │ scaffold-module-file                 │ 开     │ app.module.file.enabled=false │
# │ scaffold-module-report               │ 开     │ app.module.report.enabled=... │
# │ scaffold-module-cms-workflow         │ 关     │ app.module.cms.workflow=true  │
# ├──────────────────────────────────────┼────────┼───────────────────────────────┤
# │ scaffold-module-cms-inbox            │ 开     │ app.module.cms.inbox=false    │
# ├──────────────────────────────────────┼────────┼───────────────────────────────┤
# │ 流程审批桥（CMS workflow 开源；商业套件 workflow 随 enterprise 剥离）        │
# └──────────────────────────────────────┴────────┴───────────────────────────────┘
#
# CMS workflow 开源版可用；CRM / Ticket / Inventory / OA 的 workflow 桥随商业套件提供。
#
# 下面只显式列默认开的 inbox / workflow 主模块；其余依赖 @ConditionalOnProperty
# 的 matchIfMissing 兜底。如需在生产固化默认值，复制对应行追加进 module: 即可。
app:
  module:
    inbox:
      enabled: ${APP_MODULE_INBOX:true}
    workflow:
      enabled: ${APP_MODULE_WORKFLOW:true}

# OAuth2 / OIDC SSO（Authorization Code，仅作客户端）。
# 不配置 spring.security.oauth2.client.registration.* 时整个 SSO 入口自动关闭。
sso:
  # 找不到本地账号是否自动开户；自动开户出来的账号默认 disable，需管理员审核
  auto-provision: ${SSO_AUTO_PROVISION:true}
  # 自动开户后用户的初始状态：1=禁用 0=正常（建议保持 1）
  auto-provision-status: ${SSO_AUTO_PROVISION_STATUS:1}
  # 登录成功后跳转到前端的回调路径（前端需实现 /sso/callback 落 token）
  front-callback: ${SSO_FRONT_CALLBACK:/sso/callback}
  # 登录失败回跳路径，会附带 ssoError 查询参数
  failure-redirect: ${SSO_FAILURE_REDIRECT:/login}
  # IDP 按钮元数据：sso.providers.<id>.label / icon
  providers: {}
  # 标准 IDP 接入示例（取消注释后即可生效）：
  # spring:
  #   security:
  #     oauth2:
  #       client:
  #         registration:
  #           azure:
  #             client-id: ${AZURE_CLIENT_ID}
  #             client-secret: ${AZURE_CLIENT_SECRET}
  #             scope: openid,profile,email
  #             provider: azure
  #             redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  #         provider:
  #           azure:
  #             issuer-uri: https://login.microsoftonline.com/<tenant>/v2.0
