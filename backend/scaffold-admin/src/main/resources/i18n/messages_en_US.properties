## structured biz errors (aligned with BizCode#errorKey)
BIZ_SUCCESS=Operation succeeded
BIZ_PARAM_INVALID=Invalid request parameters
BIZ_PARAM_MISSING=Required parameters are missing
BIZ_UNAUTHORIZED=Your session has expired, please sign in again
BIZ_FORBIDDEN=You are not authorized, please contact administrator
BIZ_DEMO_MODE=Demo mode: this action is not allowed
BIZ_RESOURCE_NOT_FOUND=Resource not found
BIZ_METHOD_NOT_ALLOWED=HTTP method not allowed
BIZ_UNSUPPORTED_MEDIA=Unsupported media type
BIZ_CONFLICT=Resource conflict or locked
BIZ_DUPLICATE_SUBMIT=The request is being processed, please do not submit again
BIZ_RATE_LIMITED=Too many requests, please try again later
BIZ_INTERNAL_ERROR=Internal server error, please contact administrator
