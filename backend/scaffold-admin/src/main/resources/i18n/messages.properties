##结构化错误码（与 com.scaffold.common.constant.BizCode#errorKey 对齐）
BIZ_SUCCESS=操作成功
BIZ_PARAM_INVALID=参数校验失败
BIZ_PARAM_MISSING=缺少必要参数
BIZ_UNAUTHORIZED=登录已过期，请重新登录
BIZ_FORBIDDEN=没有权限，请联系管理员授权
BIZ_DEMO_MODE=演示模式，不允许操作
BIZ_RESOURCE_NOT_FOUND=资源不存在
BIZ_METHOD_NOT_ALLOWED=不允许的请求方式
BIZ_UNSUPPORTED_MEDIA=不支持的数据类型
BIZ_CONFLICT=资源冲突或被锁定
BIZ_DUPLICATE_SUBMIT=操作正在处理中，请勿重复提交
BIZ_RATE_LIMITED=访问过于频繁，请稍后再试
BIZ_INTERNAL_ERROR=系统内部错误，请联系管理员
BIZ_DEPENDENCY_UNAVAILABLE=下游依赖暂不可用，请稍后再试
BIZ_BUSINESS_ERROR=业务处理失败
