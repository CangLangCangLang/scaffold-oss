services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      # 注意：必须与 MySQL 8 默认 utf8mb4_0900_ai_ci 一致，否则跨模块表 JOIN（sys_user / sys_dept / 模块业务表）会
      # 报 "Illegal mix of collations (utf8mb4_unicode_ci, IMPLICIT) and (utf8mb4_0900_ai_ci, IMPLICIT) for operation '='"。
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-project}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-druid}
      LIQUIBASE_ENABLED: ${LIQUIBASE_ENABLED:-true}
      DB_URL: "${DB_URL:-jdbc:mysql://mysql:3306/project?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}"
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-3}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      DRUID_STAT_VIEW_ENABLED: ${DRUID_STAT_VIEW_ENABLED:-false}
      APP_UPLOAD_PATH: /data/scaffold/uploadPath
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - backend-data:/data/scaffold

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      VITE_APP_BASE_API: ${VITE_APP_BASE_API:-/dev-api}
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  mysql-data:
  redis-data:
  backend-data:
